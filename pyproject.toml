[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "backend"]
extend-exclude = ["frontend", "samples", "projects"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: needs a CUDA GPU or large models (skipped in CI)",
    "slow: slow test",
]
